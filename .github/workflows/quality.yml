name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Auditoría estática
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          # html-validate 11.17 requiere ^22.22.0 || >=24.8.0
          node-version: 24

      - name: Sintaxis JavaScript
        run: node --check script.js

      - name: Auditoría del proyecto
        run: node agent/audit.mjs

      - name: Validación HTML
        run: npx --yes html-validate@11.17.0 index.html terminos.html privacidad.html
